<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Тема 5 презентации</title>
    <style>body { margin: 0; padding: 0; background: #1A252C; }</style>
</head>
<body>
    <div id="presentation-root"></div>
    <script>

// ============================================================================
// ЧАСТЬ 1: ИНИЦИАЛИЗАЦИЯ И УПРАВЛЕНИЕ СОСТОЯНИЕМ (STATE MANAGEMENT)
// ============================================================================
const PresentationPlatform = (() => {
    // Глобальное реактивное состояние презентации
    const state = {
        currentSlide: 0,
        totalSlides: 10,
        // Симуляция 1: Трение
        frictionSim: {
            mass: 2,          // кг
            mu: 0.2,          // коэффициент трения
            forceX: 1,        // внешняя сила тяги в Ньютонах
            isMoving: false,  // статус движения бруска
            posX: 100,        // текущая координата бруска для отрисовки
            velocityX: 0      // скорость движения
        },
        // Симуляция 2: Закон всемирного тяготения
        gravitySim: {
            mass1: 100,       // условная масса тела 1
            mass2: 100,       // условная масса тела 2
            distance: 4,      // расстояние между центрами в условных единицах
            force: 6.25       // рассчитанная сила притяжения
        },
        // Симуляция 3: Лифт и весовые состояния
        elevatorSim: {
            stateType: 'rest', // 'rest' (покой), 'overload' (перегрузка), 'zero-g' (невесомость)
            animationFrame: null,
            boxY: 0
        },
        // Ответы пользователя в диагностическом блоке
        diagnostics: {
            task1: { forceFriction: null, normalReaction: null, acceleration: null },
            task2: { selectedAnswer: null },
            task3: { selectedAnswer: null },
            task4: { selectedAnswer: null },
            isSubmitted: [false, false, false, false],
            score: 0
        }
    };

    // Слушатели изменений состояния для реактивного обновления интерфейса
    const listeners = [];
    const subscribe = (listener) => { listeners.push(listener); };
    const notify = () => { listeners.forEach(callback => callback(state)); };

    const updateState = (path, value) => {
        let current = state;
        const parts = path.split('.');
        for (let i = 0; i < parts.length - 1; i++) {
            current = current[parts[i]];
        }
        current[parts[parts.length - 1]] = value;
        notify();
    };

    return { state, subscribe, updateState, notify };
})();
// ============================================================================
// ЧАСТЬ 2: АРХИТЕКТУРА СТИЛЕЙ И СТРУКТУРНЫЙ РЕНДЕРИНГ
// ============================================================================
const PresentationStyles = {
    inject: () => {
        const styleElement = document.createElement('style');
        styleElement.textContent = `
            :root {
                --brand-dark: #1A252C;
                --brand-teal: #0D6066;
                --brand-teal-light: #E6F2F3;
                --brand-gray: #F4F6F7;
                --brand-alert: #8C2D19;
                --brand-accent: #E67E22;
                --text-main: #2C3E50;
            }
            .pres-container {
                font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
                background-color: var(--brand-dark);
                color: var(--text-main);
                width: 100vw;
                height: 100vh;
                display: flex;
                flex-direction: column;
                justify-content: space-between;
                overflow: hidden;
                margin: 0; padding: 0;
                box-sizing: border-box;
            }
            .pres-header {
                background: linear-gradient(90deg, var(--brand-dark) 0%, #2c3e50 100%);
                padding: 15px 30px;
                display: flex;
                justify-content: space-between;
                align-items: center;
                border-bottom: 3px solid var(--brand-teal);
                color: #ffffff;
            }
            .pres-header h1 { margin: 0; font-size: 1.25rem; font-weight: 700; letter-spacing: 0.5px; }
            .pres-header .meta-tag { font-size: 0.8rem; background: var(--brand-teal); padding: 4px 10px; border-radius: 3px; font-weight: bold; }
            .pres-body { flex: 1; display: flex; padding: 30px; background-color: #ffffff; overflow-y: auto; position: relative; }
            .slide-content { width: 100%; display: flex; flex-direction: column; gap: 20px; }
            .two-columns { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; min-height: 400px; }
            .theory-panel { display: flex; flex-direction: column; gap: 15px; }
            .interactive-panel { background-color: var(--brand-gray); border-radius: 8px; border: 1px solid #e2e8f0; padding: 20px; display: flex; flex-direction: column; gap: 20px; position: relative; }
            .formula-box { background: var(--brand-teal-light); border-left: 5px solid var(--brand-teal); padding: 15px; border-radius: 0 6px 6px 0; font-size: 1.4rem; font-family: 'Courier New', Courier, monospace; font-weight: bold; color: var(--brand-teal); text-align: center; margin: 10px 0; }
            .alert-box { background: #FDF2F0; border-left: 5px solid var(--brand-alert); padding: 15px; border-radius: 0 6px 6px 0; color: #5C1D10; }
            .alert-box h3 { margin-top: 0; color: var(--brand-alert); }
            .control-group { display: flex; flex-direction: column; gap: 8px; }
            .control-group label { font-weight: bold; font-size: 0.9rem; color: #4a5568; }
            .slider-input { width: 100%; accent-color: var(--brand-teal); }
            .vector-canvas { background: #ffffff; border: 1px solid #cbd5e1; border-radius: 6px; width: 100%; height: 220px; }
            .pres-footer { background-color: #ffffff; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #e2e8f0; }
            .nav-btn { background-color: var(--brand-teal); color: white; border: none; padding: 10px 20px; font-size: 1rem; font-weight: bold; border-radius: 4px; cursor: pointer; transition: background 0.2s; }
            .nav-btn:hover { background-color: #0a494d; }
            .nav-btn:disabled { background-color: #cbd5e1; cursor: not-allowed; }
            .progress-container { display: flex; align-items: center; gap: 10px; width: 40%; }
            .progress-bar-bg { background-color: #e2e8f0; height: 8px; border-radius: 4px; flex: 1; overflow: hidden; }
            .progress-bar-fill { background-color: var(--brand-teal); height: 100%; transition: width 0.3s ease; }
            .quiz-option { display: block; background: #ffffff; border: 2px solid #e2e8f0; border-radius: 6px; padding: 12px 18px; margin-bottom: 10px; cursor: pointer; transition: all 0.2s; text-align: left; width: 100%; font-size: 1rem; }
            .quiz-option:hover { border-color: var(--brand-teal); background-color: var(--brand-teal-light); }
            .quiz-option.selected { border-color: var(--brand-teal); background-color: var(--brand-teal); color: white; }
            .quiz-select-wrapper { display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; }
            .select-label { font-weight: bold; font-size: 0.95rem; }
            .custom-select { padding: 10px; border-radius: 6px; border: 2px solid #e2e8f0; width: 100%; font-size: 0.95rem; outline: none; }
            .custom-select:focus { border-color: var(--brand-teal); }
            .submit-btn { background-color: var(--brand-accent); color: white; border: none; padding: 12px 24px; font-size: 1rem; font-weight: bold; border-radius: 4px; cursor: pointer; width: 100%; margin-top: 10px; }
            .submit-btn:hover { background-color: #d35400; }
            .badge { display: inline-block; padding: 3px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; color: white; margin-bottom: 5px; }
            .badge-theory { background-color: var(--brand-teal); }
            .badge-diagnostic { background-color: var(--brand-accent); }
            .badge-trap { background-color: var(--brand-alert); }
        `;
        document.head.appendChild(styleElement);
    }
};
// ============================================================================
// ЧАСТЬ 3: ДВИЖОК НАВИГАЦИИ И СТРУКТУРНЫЙ ШАБЛОН (LAYOUT)
// ============================================================================
const PresentationLayout = {
    renderBase: (state, slideContentHTML) => {
        const progressPercent = (state.currentSlide / (state.totalSlides - 1)) * 100;
        return `
            <div class="pres-container">
                <header class="pres-header">
                    <div>
                        <span class="meta-tag">ОГЭ ФИЗИКА — ИНТЕРАКТИВНЫЙ ОПТИМИЗАТОР</span>
                        <h1>Тема 5. Гравитация и силы трения скольжения</h1>
                    </div>
                    <div>Слайд ${state.currentSlide + 1} из ${state.totalSlides}</div>
                </header>
                <main class="pres-body">
                    ${slideContentHTML}
                </main>
                <footer class="pres-footer">
                    <button class="nav-btn" id="prevSlideBtn" ${state.currentSlide === 0 ? 'disabled' : ''}>← Назад</button>
                    <div class="progress-container">
                        <span>Прогресс</span>
                        <div class="progress-bar-bg">
                            <div class="progress-bar-fill" style="width: ${progressPercent}%"></div>
                        </div>
                    </div>
                    <button class="nav-btn" id="nextSlideBtn" ${state.currentSlide === state.totalSlides - 1 ? 'disabled' : ''}>Вперед →</button>
                </footer>
            </div>
        `;
    },
    setupNavigationListeners: () => {
        document.getElementById('prevSlideBtn')?.addEventListener('click', () => {
            if (PresentationPlatform.state.currentSlide > 0) {
                PresentationPlatform.updateState('currentSlide', PresentationPlatform.state.currentSlide - 1);
            }
        });
        document.getElementById('nextSlideBtn')?.addEventListener('click', () => {
            if (PresentationPlatform.state.currentSlide < PresentationPlatform.state.totalSlides - 1) {
                PresentationPlatform.updateState('currentSlide', PresentationPlatform.state.currentSlide + 1);
            }
        });
    }
};
// ============================================================================
// ЧАСТЬ 4: СЛАЙДЫ ТЕОРИИ ТРЕНИЯ (СЛАЙДЫ 1 И 2) + РЕНДЕРЕРЫ
// ============================================================================
const SlideRenderers = {};

SlideRenderers[0] = (state) => {
    return `
        <div class="slide-content">
            <div>
                <span class="badge badge-theory">Теория</span>
                <h2>Сила трения покоя: Закон компенсации</h2>
            </div>
            <div class="two-columns">
                <div class="theory-panel">
                    <p><strong>Сила трения покоя (F<sub>тр.пок</sub>)</strong> возникает между соприкасающимися поверхностями, когда их пытаются сдвинуть внешними силами, но относительного движения еще нет.</p>
                    <div class="formula-box">F<sub>тр.пок</sub> = F<sub>внеш</sub></div>
                    <p><strong>Главное правило ОГЭ:</strong> Сила трения покоя не рассчитывается по формуле μN! Она реактивна и <em>всегда в точности равна внешней сдвигающей силе</em>, увеличиваясь вместе с ней от нуля до критического порога страгивания.</p>
                </div>
                <div class="interactive-panel">
                    <h3>Интерактивная модель: Порог покоя</h3>
                    <div class="control-group">
                        <label>Внешняя сила тяги (F<sub>тяги</sub>): <span id="valForceX">${state.frictionSim.forceX}</span> Н</label>
                        <input type="range" class="slider-input" id="sim1ForceSlider" min="0" max="5" step="0.5" value="${state.frictionSim.forceX}">
                    </div>
                    <div class="control-group">
                        <label>Максимальная сила трения покоя (μN): 4.0 Н (Задана массой m=2кг, μ=0.2)</label>
                    </div>
                    <canvas id="frictionSimCanvas1" class="vector-canvas"></canvas>
                </div>
            </div>
        </div>
    `;
};

SlideRenderers[1] = (state) => {
    return `
        <div class="slide-content">
            <div>
                <span class="badge badge-theory">Теория</span>
                <h2>Сила трения скольжения: Динамическая стабилизация</h2>
            </div>
            <div class="two-columns">
                <div class="theory-panel">
                    <p>Когда внешняя сила преодолевает максимальный порог удержания, микронеровности частично сглаживаются (ломаются) — начинается макроскопическое относительное движение.</p>
                    <div class="formula-box">F<sub>тр.скольж</sub> = μ · N</div>
                    <p>где <strong>μ</strong> — безразмерный коэффициент трения (зависит исключительно от характера материалов), а <strong>N</strong> — сила нормальной реакции опоры. В рамках задач ОГЭ данное значение принимается строго постоянным в процессе скольжения.</p>
                </div>
                <div class="interactive-panel">
                    <h3>Интерактивная модель: Фаза скольжения</h3>
                    <div class="control-group">
                        <label>Коэффициент трения (μ): <span id="valMu">${state.frictionSim.mu}</span></label>
                        <input type="range" class="slider-input" id="sim2MuSlider" min="0.1" max="0.5" step="0.05" value="${state.frictionSim.mu}">
                    </div>
                    <div class="control-group">
                        <label>Сила реакции опоры (N = mg): 20 Н</label>
                    </div>
                    <div class="formula-box" style="font-size: 1.1rem; background: #fff;">F<sub>тр</sub> = ${state.frictionSim.mu} × 20 = ${(state.frictionSim.mu * 20).toFixed(1)} Н</div>
                    <canvas id="frictionSimCanvas2" class="vector-canvas"></canvas>
                </div>
            </div>
        </div>
    `;
};
// ============================================================================
// ЧАСТЬ 5: СЛАЙДЫ ГРАВИТАЦИИ И ЗАКОНА ТЯГОТЕНИЯ (СЛАЙДЫ 3 И 4)
// ============================================================================
SlideRenderers[2] = (state) => {
    return `
        <div class="slide-content">
            <div>
                <span class="badge badge-theory">Теория</span>
                <h2>Закон всемирного тяготения: Архитектура полей</h2>
            </div>
            <div class="two-columns">
                <div class="theory-panel">
                    <p>Любые две материальные точки во Вселенной притягиваются друг к другу по линии, соединяющей их геометрические центры.</p>
                    <div class="formula-box">F = G · (m₁ · m₂) / R²</div>
                    <p>Обратите внимание на <strong>квадратичную зависимость от расстояния (R²)</strong> в знаменателе. Изменение дистанции оказывает степенное, а не линейное воздействие на результирующее силовое поле гравитации.</p>
                </div>
                <div class="interactive-panel">
                    <h3>Интерактивная модель: Квадрат расстояния</h3>
                    <div class="control-group">
                        <label>Расстояние между телами (R): <span id="valDistance">${state.gravitySim.distance}</span> у.е.</label>
                        <input type="range" class="slider-input" id="gravityDistSlider" min="2" max="8" step="1" value="${state.gravitySim.distance}">
                    </div>
                    <canvas id="gravitySimCanvas" class="vector-canvas"></canvas>
                </div>
            </div>
        </div>
    `;
};

SlideRenderers[3] = (state) => {
    return `
        <div class="slide-content">
            <div>
                <span class="badge badge-theory">Теория</span>
                <h2>Сила тяжести и Спутники</h2>
            </div>
            <div class="two-columns">
                <div class="theory-panel">
                    <p><strong>Сила тяжести (F<sub>тяж</sub>)</strong> — это частное проявление закона тяготения у поверхности планеты.</p>
                    <div class="formula-box">F<sub>тяж</sub> = m · g</div>

                    <div class="formula-box" style="font-size:1.1rem;">v₁ = √(g · R) ≈ 7.9 км/с (для Земли)</div>
                </div>
                <div class="interactive-panel" style="justify-content: center; align-items: center; background: #0f172a;">
                    <div style="color: #38bdf8; font-weight: bold; margin-bottom: 10px;">Орбитальное вечное падение (Схема)</div>
                    <div style="position: relative; width: 200px; height: 200px; border-radius: 50%; background: #1e3a8a; border: 2px solid #3b82f6;">

                </div>
            </div>
        </div>
    `;
};
// ============================================================================
// ЧАСТЬ 6: ДИНАМИКА ВЕСА В ЛИФТЕ И МЕТОДИЧЕСКИЙ ЧЕК-ЛИСТ (СЛАЙДЫ 5 И 6)
// ============================================================================
SlideRenderers[4] = (state) => {
    return `
        <div class="slide-content">
            <div>
                <span class="badge badge-theory">Теория</span>
                <h2>Разделение понятий: Сила тяжести vs Вес</h2>
            </div>
            <div class="two-columns">
                <div class="theory-panel">
                    <p>Ключевая концептуальная разница, проверяемая на экзамене:</p>
                    <ul>

                        <li><strong>Вес тела (P):</strong> Сила упругости. Приложена к <em>опоре или подвесу</em>. Модифицируется при ускоренном движении.</li>
                    </ul>
                    <div class="formula-box" id="elevatorFormula">P = m · g</div>

                <div class="interactive-panel">

SlideRenderers[5] = (state) => {
    return `
        <div class="slide-content">
            <div>
                <span class="badge badge-trap">Чек-лист методических ловушек</span>

            </div>

// ============================================================================
// ЧАСТЬ 7: ДИАГНОСТИЧЕСКИЙ БЛОК — ЗАДАЧИ 1 И 2 (СЛАЙДЫ 7 И 8)
// ============================================================================
SlideRenderers[6] = (state) => {
    const t = state.diagnostics.task1;
    const subm = state.diagnostics.isSubmitted[0];
    return `
        <div class="slide-content">
            <div>
                <span class="badge badge-diagnostic">Диагностика (База)</span>
                <h2>Задача №1: Экспресс-анализ векторов при торможении</h2>
            </div>
            <p>Тяжелый брусок скользит по горизонтальной шероховатой плоскости строго вправо и экстренно сбавляет скорость (тормозит). Сопоставьте кинематические параметры с пространственным направлением стрелок.</p>
            <div class="two-columns">
                <div class="theory-panel">
                    <div class="quiz-select-wrapper">
                        <span class="select-label">1. Скорость бруска (v):</span>

                            <option value="right" ${t.forceFriction==='right'?'selected':''}>Стрелка Вправо</option>

                    </div>
                    <div class="quiz-select-wrapper">
                        <span class="select-label">3. Ускорение бруска (a):</span>

                            <option value="" disabled selected>Выберите направление...</option>

                            <option value="left" ${t.acceleration==='left'?'selected':''}>Стрелка Влево</option>
                            <option value="up" ${t.acceleration==='up'?'selected':''}>Стрелка Вверх</option>
                        </select>
                    </div>
                    <button class="submit-btn" id="btnSubmitTask1" ${subm?'disabled':''}>${subm?'Ответ зафиксирован':'Зафиксировать ответ задачи №1'}</button>
                </div>
                <div class="interactive-panel" style="justify-content:center; align-items:center;">
                    <div style="width:80%; height:40px; background:#94a3b8; border-bottom:4px solid #475569; position:relative; margin-top:50px;">
                        <div style="position:absolute; top:-30px; left:40%; width:50px; height:30px; background:var(--brand-teal); border:2px solid var(--brand-dark); text-align:center; color:white; font-weight:bold; font-size:0.8rem; line-height:26px;">m</div>
                        <div style="position:absolute; top:-70px; left:52%; font-weight:bold; color:var(--brand-accent);">v →</div>
                    </div>
                    <div style="margin-top:20px; text-align:center; font-size:0.9rem; color:#64748b;">Подсказка: Сила трения всегда направлена наперекор скольжению граней. Куда нацелен вектор ускорения при замедлении?</div>
                </div>
            </div>
        </div>
    `;
};

SlideRenderers[7] = (state) => {
    const ans = state.diagnostics.task2.selectedAnswer;
    const subm = state.diagnostics.isSubmitted[1];
    const optClass = (idx) => ans === idx ? 'quiz-option selected' : 'quiz-option';
    return `
        <div class="slide-content">
            <div>
                <span class="badge badge-diagnostic">Диагностика (Расчеты)</span>
                <h2>Задача №2: Проверка барьера покоя</h2>
            </div>
            <p>Брусок массой 3 кг покоится на горизонтальном столе. Коэффициент трения между ними μ = 0.25. К бруску прикладывают горизонтальную силу тяги, равную 5 Н. Какова будет итоговая сила трения, действующая на брусок?</p>
            <div class="theory-panel">
                <button class="${optClass(0)}" id="t2_o0" ${subm?'disabled':''}>А) 7.5 Н (Рассчитано строго по формуле μ · m · g)</button>
                <button class="${optClass(1)}" id="t2_o1" ${subm?'disabled':''}>Б) 5.0 Н (Тело не сдвинется, сила трения покоя сбалансирует внешнюю тягу)</button>
                <button class="${optClass(2)}" id="t2_o2" ${subm?'disabled':''}>В) 2.5 Н (Разность между силой тяжести и внешней нагрузкой)</button>
                <button class="${optClass(3)}" id="t2_o3" ${subm?'disabled':''}>Г) 0 Н (В статическом положении сила трения отсутствует полностью)</button>
                <button class="submit-btn" id="btnSubmitTask2" ${subm?'disabled':''}>${subm?'Ответ зафиксирован':'Зафиксировать ответ задачи №2'}</button>
            </div>
        </div>
    `;
};
// ============================================================================
// ЧАСТЬ 8: ДИАГНОСТИКА — ЗАДАЧИ 3 И 4 + АНАЛИТИКА СЕССИИ (СЛАЙДЫ 9 И 10)
// ============================================================================
SlideRenderers[8] = (state) => {
    const ans = state.diagnostics.task3.selectedAnswer;
    const subm = state.diagnostics.isSubmitted[2];
    const optClass = (idx) => ans === idx ? 'quiz-option selected' : 'quiz-option';
    return `
        <div class="slide-content">
            <div>
                <span class="badge badge-diagnostic">Диагностика (Ловушка ОГЭ)</span>
                <h2>Задача №3: Орбитальное масштабирование гравитации</h2>
            </div>
            <p>Космическая автоматическая станция удаляется от поверхности Земли на расстояние, равное трем радиусам Земли (3R<sub>З</sub>). Во сколько раз уменьшится сила гравитационного притяжения станции к Земле по сравнению с силой притяжения на поверхности?</p>
            <div class="theory-panel">
                <button class="${optClass(0)}" id="t3_o0" ${subm?'disabled':''}>А) Уменьшится ровно в 3 раза</button>

                <button class="${optClass(2)}" id="t3_o2" ${subm?'disabled':''}>В) Уменьшится в 16 раз (Так как расстояние считается от центра Земли: R + 3R = 4R, а 4² = 16)</button>
                <button class="${optClass(3)}" id="t3_o3" ${subm?'disabled':''}>Г) Совершенно не изменится, на орбите действует невесомость</button>
                <button class="submit-btn" id="btnSubmitTask3" ${subm?'disabled':''}>${subm?'Ответ зафиксирован':'Зафиксировать ответ задачи №3'}</button>
            </div>
        </div>
    `;
};

SlideRenderers[9] = (state) => {
    let totalScore = 0;
    if (state.diagnostics.isSubmitted[0]) {
        const t = state.diagnostics.task1;
        if (t.forceFriction === 'right' && t.normalReaction === 'left' && t.acceleration === 'left') totalScore += 25;
    }
    if (state.diagnostics.isSubmitted[1] && state.diagnostics.task2.selectedAnswer === 1) totalScore += 25;
    if (state.diagnostics.isSubmitted[2] && state.diagnostics.task3.selectedAnswer === 2) totalScore += 25;
    
    // Автоматическая заглушка для финального расчета
    const mockFullScore = totalScore; 

    return `
        <div class="slide-content">
            <div>
                <span class="badge badge-theory">Аналитика сессии</span>
                <h2>Диагностическая карта результатов по Теме №5</h2>
            </div>
            <div class="interactive-panel" style="text-align: center; padding: 40px; gap:25px;">
                <h3>Ваш текущий показатель усвоения материала:</h3>
                <div style="font-size: 4rem; font-weight: bold; color: var(--brand-teal);">${mockFullScore} / 100</div>
                <div class="progress-bar-bg" style="width: 60%; margin: 0 auto; height: 15px; border-radius: 10px;">
                    <div class="progress-bar-fill" style="width: ${mockFullScore}%; background-color: var(--brand-accent);"></div>
                </div>
                <p style="max-width: 500px; margin: 0 auto; color: #64748b; font-size: 0.95rem;">
                    Прогресс рассчитывается автоматически на основе зафиксированных ответов диагностических блоков. Если результат ниже 75, рекомендуется вернуться к интерактивным моделям трения покоя и лифта.
                </p>
                <button class="nav-btn" style="margin: 0 auto; width: 250px; background: var(--brand-dark);" id="btnResetAllDiagnostics">Сбросить и пройти заново</button>
            </div>
        </div>
    `;
};
// ============================================================================
// ЧАСТЬ 9: ОРИГИНАЛЬНЫЙ СИСТЕМНЫЙ ИНТЕРФЕЙС ОТРИСОВКИ СИМУЛЯЦИЙ (CANVAS ENGINE)
// ============================================================================
const VisualEngine = {
    drawFrictionSim1: (canvas, forceX) => {
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // Опора
        ctx.strokeStyle = '#1A252C'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(20, 160); ctx.lineTo(canvas.width - 20, 160); ctx.stroke();
        
        // Брусок
        ctx.fillStyle = '#F4F6F7'; ctx.strokeStyle = '#1A252C'; ctx.lineWidth = 2;
        ctx.fillRect(100, 100, 100, 60); ctx.strokeRect(100, 100, 100, 60);
        ctx.fillStyle = '#1A252C'; ctx.beginPath(); ctx.arc(150, 130, 4, 0, Math.PI*2); ctx.fill();

        // Сила тяги (Вправо)
        if (forceX > 0) {
            VisualEngine.drawArrow(ctx, 150, 130, 150 + forceX * 25, 130, '#0D6066', `Fтяги = ${forceX}H`);
            // Сила трения покоя (Влево) — в точности равна тяге!
            VisualEngine.drawArrow(ctx, 150, 130, 150 - forceX * 25, 130, '#8C2D19', `Fтр.пок = ${forceX}H`);
        }
    },
    drawFrictionSim2: (canvas, mu) => {
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        ctx.strokeStyle = '#1A252C'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(20, 160); ctx.lineTo(canvas.width - 20, 160); ctx.stroke();
        
        ctx.fillStyle = '#E6F2F3'; ctx.strokeStyle = '#1A252C'; ctx.lineWidth = 2;
        ctx.fillRect(120, 100, 100, 60); ctx.strokeRect(120, 100, 100, 60);

        const fTr = (mu * 20).toFixed(1);
        VisualEngine.drawArrow(ctx, 170, 130, 240, 130, '#0D6066', 'v (Скольжение)');
        VisualEngine.drawArrow(ctx, 170, 130, 170 - fTr * 12, 130, '#8C2D19', `Fтр.скольж = ${fTr}H`);
        VisualEngine.drawArrow(ctx, 170, 130, 170, 50, '#1A252C', 'N = 20H');
        VisualEngine.drawArrow(ctx, 170, 130, 170, 210, '#1A252C', 'mg = 20H');
    },
    drawGravitySim: (canvas, distance) => {
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const cY = canvas.height / 2;
        const x1 = 60;
        const x2 = x1 + distance * 35;

        // Тело 1
        ctx.fillStyle = '#0D6066'; ctx.beginPath(); ctx.arc(x1, cY, 20, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.fillText('m₁', x1-6, cY+4);

        // Тело 2
        ctx.fillStyle = '#1A252C'; ctx.beginPath(); ctx.arc(x2, cY, 15, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.fillText('m₂', x2-6, cY+4);

        // Расстояние линия
        ctx.strokeStyle = '#94a3b8'; ctx.setLineDash([4, 4]);
        ctx.beginPath(); ctx.moveTo(x1, cY + 30); ctx.lineTo(x2, cY + 30); ctx.stroke();
        ctx.setLineDash([]); ctx.fillStyle = '#475569'; ctx.fillText(`Расстояние R = ${distance} у.е.`, (x1+x2)/2 - 50, cY + 45);

        // Векторы сил (обратно пропорциональны квадрату расстояния)
        const forceLength = (1 / (distance * distance)) * 400;
        VisualEngine.drawArrow(ctx, x1, cY, x1 + forceLength, cY, '#E67E22', 'F₁');
        VisualEngine.drawArrow(ctx, x2, cY, x2 - forceLength, cY, '#E67E22', 'F₂');
    },
    drawElevatorSim: (canvas, type) => {
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Шахта кабины
        ctx.strokeStyle = '#cbd5e1'; ctx.lineWidth = 1; ctx.strokeRect(100, 20, 100, 200);

        // Кабина лифта
        ctx.fillStyle = '#F4F6F7'; ctx.strokeStyle = '#1A252C'; ctx.lineWidth = 2;
        ctx.fillRect(110, 60, 80, 120); ctx.strokeRect(110, 60, 80, 120);

        // Груз (Тело)
        ctx.fillStyle = 'var(--brand-teal)'; ctx.fillRect(135, 140, 30, 40);

        // Силы
        if (type === 'rest') {
            VisualEngine.drawArrow(ctx, 150, 160, 150, 100, '#0D6066', 'N = mg');
            VisualEngine.drawArrow(ctx, 150, 160, 150, 220, '#1A252C', 'mg');
        } else if (type === 'overload') {
            VisualEngine.drawArrow(ctx, 150, 160, 150, 70, '#0D6066', 'N = m(g+a)');
            VisualEngine.drawArrow(ctx, 150, 160, 150, 220, '#1A252C', 'mg');
            VisualEngine.drawArrow(ctx, 220, 80, 220, 50, '#8C2D19', 'a ↑');
        } else if (type === 'zero-g') {
            // Вес исчезает, N = 0. Остается только сила тяжести
            VisualEngine.drawArrow(ctx, 150, 140, 150, 200, '#1A252C', 'mg');
            VisualEngine.drawArrow(ctx, 220, 80, 220, 110, '#8C2D19', 'a = g ↓');
            ctx.fillStyle = '#8C2D19'; ctx.fillText('N = 0 (Вес P=0)', 115, 50);
        }
    },
    drawArrow: (ctx, fromx, fromy, tox, toy, color, text) => {
        const headlen = 8;
        const angle = Math.atan2(toy - fromy, tox - fromx);
        ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(fromx, fromy); ctx.lineTo(tox, toy); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(tox, toy);
        ctx.lineTo(tox - headlen * Math.cos(angle - Math.PI / 6), toy - headlen * Math.sin(angle - Math.PI / 6));
        ctx.lineTo(tox - headlen * Math.cos(angle + Math.PI / 6), toy - headlen * Math.sin(angle + Math.PI / 6));
        ctx.fill();
        if (text) { ctx.font = "bold 11px sans-serif"; ctx.fillText(text, tox + 5 * Math.cos(angle), toy + 5 * Math.sin(angle)); }
    }
};
// ============================================================================
// ЧАСТЬ 10: СИСТЕМНЫЙ КОНТРОЛЛЕР И ТРИГГЕР ЗАПУСКА (SYSTEM CONTROLLER)
// ============================================================================
const PresentationController = {
    init: () => {
        PresentationStyles.inject();
        PresentationPlatform.subscribe(PresentationController.syncDOM);
        PresentationPlatform.notify(); // Первичный рендеринг
    },
    syncDOM: (state) => {
        const root = document.getElementById('presentation-root') || document.body;
        const currentHTML = SlideRenderers[state.currentSlide](state);
        root.innerHTML = PresentationLayout.renderBase(state, currentHTML);
        
        PresentationLayout.setupNavigationListeners();
        PresentationController.bindSlideEvents(state);
    },
    bindSlideEvents: (state) => {
        // Слайд 1: Модель трения покоя
        if (state.currentSlide === 0) {
            const canvas = document.getElementById('frictionSimCanvas1');
            VisualEngine.drawFrictionSim1(canvas, state.frictionSim.forceX);
            document.getElementById('sim1ForceSlider')?.addEventListener('input', (e) => {
                const val = parseFloat(e.target.value);
                PresentationPlatform.state.frictionSim.forceX = val;
                document.getElementById('valForceX').textContent = val;
                VisualEngine.drawFrictionSim1(canvas, val);
            });
        }
        // Слайд 2: Модель трения скольжения
        if (state.currentSlide === 1) {
            const canvas = document.getElementById('frictionSimCanvas2');
            VisualEngine.drawFrictionSim2(canvas, state.frictionSim.mu);
            document.getElementById('sim2MuSlider')?.addEventListener('input', (e) => {
                const val = parseFloat(e.target.value);
                PresentationPlatform.state.frictionSim.mu = val;
                document.getElementById('valMu').textContent = val;
                VisualEngine.drawFrictionSim2(canvas, val);
            });
        }
        // Слайд 3: Модель закона тяготения
        if (state.currentSlide === 2) {
            const canvas = document.getElementById('gravitySimCanvas');
            VisualEngine.drawStreamGravity(canvas, state.gravitySim.distance);
        }
        // Слайд 5: Лифт
        if (state.currentSlide === 4) {
            const canvas = document.getElementById('elevatorSimCanvas');
            const formula = document.getElementById('elevatorFormula');
            VisualEngine.drawElevatorSim(canvas, state.elevatorSim.stateType);
            
            document.getElementById('btnElevRest')?.addEventListener('click', () => {
                PresentationPlatform.updateState('elevatorSim.stateType', 'rest');
                formula.innerHTML = "P = m · g = 30 Н";
            });
            document.getElementById('btnElevOver')?.addEventListener('click', () => {
                PresentationPlatform.updateState('elevatorSim.stateType', 'overload');
                formula.innerHTML = "P = m · (g + a) > m · g (Вес увеличен)";
            });
            document.getElementById('btnElevZero')?.addEventListener('click', () => {
                PresentationPlatform.updateState('elevatorSim.stateType', 'zero-g');
                formula.innerHTML = "P = m · (g - g) = 0 (Полная невесомость)";
            });
        }
        // Привязка обработчиков диагностических кликов
        PresentationController.bindDiagnosticEvents(state);
    },
    bindDiagnosticEvents: (state) => {
        // Задача 1
        document.getElementById('btnSubmitTask1')?.addEventListener('click', () => {
            PresentationPlatform.updateState('diagnostics.isSubmitted.0', true);
            PresentationPlatform.state.diagnostics.task1.forceFriction = document.getElementById('task1_sel1').value;
            PresentationPlatform.state.diagnostics.task1.normalReaction = document.getElementById('task1_sel2').value;
            PresentationPlatform.state.diagnostics.task1.acceleration = document.getElementById('task1_sel3').value;
            PresentationPlatform.notify();
        });
        // Задача 2
        [0,1,2,3].forEach(idx => {
            document.getElementById(`t2_o${idx}`)?.addEventListener('click', () => {
                if(!state.diagnostics.isSubmitted[1]) PresentationPlatform.updateState('diagnostics.task2.selectedAnswer', idx);
            });
        });
        document.getElementById('btnSubmitTask2')?.addEventListener('click', () => {
            PresentationPlatform.updateState('diagnostics.isSubmitted.1', true);
        });
        // Задача 3
        [0,1,2,3].forEach(idx => {
            document.getElementById(`t3_o${idx}`)?.addEventListener('click', () => {
                if(!state.diagnostics.isSubmitted[2]) PresentationPlatform.updateState('diagnostics.task3.selectedAnswer', idx);
            });
        });
        document.getElementById('btnSubmitTask3')?.addEventListener('click', () => {
            PresentationPlatform.updateState('diagnostics.isSubmitted.2', true);
        });
        // Сброс результатов
        document.getElementById('btnResetAllDiagnostics')?.addEventListener('click', () => {
            PresentationPlatform.state.diagnostics.isSubmitted = [false, false, false, false];
            PresentationPlatform.state.diagnostics.task2.selectedAnswer = null;
            PresentationPlatform.state.diagnostics.task3.selectedAnswer = null;
            PresentationPlatform.updateState('currentSlide', 6); // Возврат к началу теста
        });
    }
};

// Дополнительный маппинг функций отрисовки для стабильности вызовов
VisualEngine.drawStreamGravity = (canvas, dist) => {
    VisualEngine.drawGravitySim(canvas, dist);
    document.getElementById('gravityDistSlider')?.addEventListener('input', (e) => {
        const val = parseInt(e.target.value);
        PresentationPlatform.state.gravitySim.distance = val;
        document.getElementById('valDistance').textContent = val;
        VisualEngine.drawGravitySim(canvas, val);
    });
};

// Глобальный триггер инициализации системы при монтировании в среду исполнения
window.addEventListener('DOMContentLoaded', PresentationController.init);
if (document.readyState === 'complete' || document.readyState === 'interactive') { PresentationController.init(); }
    </script>
